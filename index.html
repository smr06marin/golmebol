<!doctype html>
<!-- lang="es" + notranslate: la página YA está en español. Antes decía lang="en"
     y el traductor automático de algunos celulares (Oppo, Chrome) "traducía" la
     página envolviendo los textos en etiquetas propias, lo que rompe React con
     el error "insertBefore en Node" y dejaba la pantalla en negro. -->
<html lang="es" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Adelanta la conexión (DNS + TLS) a Supabase antes de que la app la
         necesite, para que la primera consulta de cada página no pierda esos
         milisegundos de handshake — se nota sobre todo en celular/datos móviles. -->
    <link rel="preconnect" href="https://obvlyexpbbdhxwijjqyd.supabase.co" crossorigin/>
    <link rel="dns-prefetch" href="https://obvlyexpbbdhxwijjqyd.supabase.co"/>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <title>Golmebol</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
