<!doctype html>
<!-- lang="es" + notranslate: la página YA está en español. Antes decía lang="en"
     y el traductor automático de algunos celulares (Oppo, Chrome) "traducía" la
     página envolviendo los textos en etiquetas propias, lo que rompe React con
     el error "insertBefore en Node" y dejaba la pantalla en negro. -->
<html lang="es" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Manifest: hace que el acceso directo / app instalada en el celular SIEMPRE
         abra en la página principal ("/"), no en la última página que la persona
         estaba viendo cuando lo creó. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#07070e" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Adelanta la conexión (DNS + TLS) a Supabase antes de que la app la
         necesite, para que la primera consulta de cada página no pierda esos
         milisegundos de handshake — se nota sobre todo en celular/datos móviles. -->
    <link rel="preconnect" href="https://obvlyexpbbdhxwijjqyd.supabase.co" crossorigin/>
    <link rel="dns-prefetch" href="https://obvlyexpbbdhxwijjqyd.supabase.co"/>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Bebas+Neue&family=Poppins:wght@900&display=swap"
      rel="stylesheet"
    />
    <title>Golmebol</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Red de seguridad final: si el navegador tiene guardada una página
         vieja de antes del último deploy, puede terminar pidiendo el
         archivo principal de React con un nombre que ya no existe en el
         servidor. Ahí ni React llega a arrancar (así que ni su propio
         "recargar sola" de más abajo puede actuar) y la pantalla queda
         completamente en negro, sin ningún aviso. Este script no depende
         de React: si a los 5 segundos el div#root sigue vacío, se recarga
         la página una sola vez (sessionStorage evita quedar en bucle si el
         sitio está realmente caído por otra razón). -->
    <script>
      (function () {
        // Recarga pidiendo la página de nuevo AL SERVIDOR, ignorando cualquier
        // copia guardada en el navegador. Un reload común a veces no alcanza
        // en el navegador normal (no pasa en modo incógnito, que no tiene nada
        // guardado): el caché del navegador puede seguir devolviendo la misma
        // página vieja, y la persona ve el mismo problema otra vez sin saber
        // que es cosa del caché. Agregar un parámetro único a la URL hace que
        // el navegador la trate como una dirección distinta a la guardada.
        function recargarSinCache() {
          try {
            var url = new URL(window.location.href)
            url.searchParams.set('_v', Date.now().toString())
            window.location.replace(url.toString())
          } catch (e) {
            window.location.reload()
          }
        }
        setTimeout(function () {
          try {
            var root = document.getElementById('root')
            if (root && root.childElementCount === 0 && !sessionStorage.getItem('golmebol_watchdog_reload')) {
              sessionStorage.setItem('golmebol_watchdog_reload', '1')
              recargarSinCache()
            }
          } catch (e) {}
        }, 5000)
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
